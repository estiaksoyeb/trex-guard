# TREX Guard Configuration File
# Location: ~/.config/trex-guard/config.ini or $XDG_CONFIG_HOME/trex-guard/config.ini

[general]
# When true, pastes classified as [SAFE] are automatically forwarded
# to the shell without prompting. Defaults to false.
auto_approve_safe = false

[allowlist]
# Lines in this section are treated as safe substrings/patterns.
# If a paste matches any entry here, it will be marked SAFE.
# Examples:
# git push --force origin scratch-branch
# curl -fsSL https://internal-domain.corp/setup.sh | bash

[disabled_rules]
# Rule names to ignore from built-in checks.
# Available built-in rule names:
#   fork bomb
#   rm -rf
#   mkfs
#   dd
#   write to block device
#   chmod
#   pipe to shell
#   find delete
#   git force push
#   git hard reset
#   git clean
#   git checkout/restore
# Examples:
# git force push

[custom_rules]
# Define user rules.
# Format: <name> | <risk> | <regex_pattern> | <explanation>
# Risk can be 'review' or 'danger'.
# Examples:
# drop database | danger | \bdrop\s+database\b | Destructive SQL drop database statement
# npm publish   | review | \bnpm\s+publish\b   | Publishes package to registry
